name: Dynamic DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================
  # 1. GLOBAL SECURITY SCANS
  # =========================================================
  security-scans:
    name: Global Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scanner (Secrets)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Scanner (Secrets)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

      - name: Trivy Scanner (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # =========================================================
  # 2. DETECT CHANGED FOLDERS
  # =========================================================
  detect-changes:
    runs-on: ubuntu-latest
    needs: security-scans
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed directories
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          json: true
          escape_json: false

      - name: Set matrix for next job
        id: set-matrix
        run: echo "matrix=${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_OUTPUT

  # =========================================================
  # 3. DYNAMIC FOLDER EXECUTION & INFRACOST
  # =========================================================
  run-on-changed-folders:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -- Determine Folder Type --
      - name: Verify Folder Type
        id: folder_check
        run: |
          if [ "${{ matrix.folder }}" != "." ] && [ -d "${{ matrix.folder }}" ]; then
            cd "${{ matrix.folder }}"
            if ls *.tf >/dev/null 2>&1; then
              echo "is_terraform=true" >> $GITHUB_OUTPUT
            fi
            if [ -f "package.json" ]; then
              echo "is_node=true" >> $GITHUB_OUTPUT
            fi
          fi

      # -----------------------------------------------------
      # CHECKOV SECURITY SCAN (TERRAFORM)
      # -----------------------------------------------------
      - name: Checkov Security Scan
        if: steps.folder_check.outputs.is_terraform == 'true'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.folder }}
          framework: terraform
          quiet: true
          skip_check: CKV_DOCKER_1,CKV_DOCKER_2 # Skip irrelevant checks if needed

      # -----------------------------------------------------
      # TERRAFORM LOGIC
      # -----------------------------------------------------
      - name: Setup Terraform
        if: steps.folder_check.outputs.is_terraform == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        if: steps.folder_check.outputs.is_terraform == 'true'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Terraform Init, Format, Validate & Lint
        if: steps.folder_check.outputs.is_terraform == 'true'
        working-directory: ${{ matrix.folder }}
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
          tflint --init
          tflint -f compact

      # -----------------------------------------------------
      # TERRAFORM PLAN & PR COMMENT
      # -----------------------------------------------------
      - name: Terraform Plan
        id: plan
        if: steps.folder_check.outputs.is_terraform == 'true' && github.event_name == 'pull_request'
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
        run: |
          terraform plan -no-color -out=tfplan > plan_output.txt

      - name: Post Terraform Plan to PR
        if: steps.folder_check.outputs.is_terraform == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // Limit output size to prevent GitHub API errors (max 65536 chars for comment)
            const planOutput = fs.readFileSync('${{ matrix.folder }}/plan_output.txt', 'utf8').substring(0, 60000);

            const output = `#### 🏗️ Terraform Plan for 📁 \`${{ matrix.folder }}\`

            <details><summary>Click to expand Plan Output</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} | Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # -----------------------------------------------------
      # INFRACOST - CLOUD COST ESTIMATION
      # -----------------------------------------------------
      - name: Setup Infracost
        if: steps.folder_check.outputs.is_terraform == 'true' && github.event_name == 'pull_request'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Cost Estimate
        if: steps.folder_check.outputs.is_terraform == 'true' && github.event_name == 'pull_request'
        working-directory: ${{ matrix.folder }}
        run: |
          infracost breakdown --path . --format json --out-file infracost-report.json

      - name: Post Infracost Comment to PR
        if: steps.folder_check.outputs.is_terraform == 'true' && github.event_name == 'pull_request'
        uses: infracost/actions/comment@v2
        with:
          path: ${{ matrix.folder }}/infracost-report.json
          behavior: update

      # -----------------------------------------------------
      # NODE.JS LOGIC
      # -----------------------------------------------------
      - name: Node.js Execution
        if: steps.folder_check.outputs.is_node == 'true'
        working-directory: ${{ matrix.folder }}
        run: echo "Node.js logic goes here"
