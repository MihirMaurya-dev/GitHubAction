name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: '👋 This issue has been automatically marked as stale because it has not had recent activity for 30 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions!'
          stale-pr-message: '👋 This Pull Request has been automatically marked as stale because it has not had recent activity for 30 days. It will be closed in 7 days if no further activity occurs. Please comment if you want to keep it open!'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
